[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-backend"
version = "0.1.0"
description = "RepoLens modular monolith API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "faiss-cpu>=1.8,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "PyJWT[crypto]>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sentence-transformers>=3.3,<6",
  "SQLAlchemy>=2.0,<3",
  "itsdangerous>=2.2,<3",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-java>=0.23,<1",
  "tree-sitter-javascript>=0.23,<1",
  "tree-sitter-python>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "uvicorn[standard]>=0.32,<1",
  "weasyprint>=62,<70",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
